```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard ค่าน้ำค่าไฟ</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f5f9;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn {
            width: 100%;
            margin-top: 20px;
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            float: right;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            background: #2563eb;
            color: white;
        }

        .pagination button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            th,
            td {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <button class="logout-btn" onclick="logout()">
        ออกจากระบบ
    </button>

    <h1>💧⚡ Dashboard ค่าน้ำค่าไฟ</h1>

    <!-- FORM -->
    <div class="card">

        <h2>📝 บันทึกข้อมูล</h2>

        <form id="dataForm">

            <div class="form-grid">

                <div>
                    <label for="month">เดือน</label>

                    <select id="month" required>
                        <option value="">-- เลือกเดือน --</option>
                        <option value="มกราคม">มกราคม</option>
                        <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                        <option value="มีนาคม">มีนาคม</option>
                        <option value="เมษายน">เมษายน</option>
                        <option value="พฤษภาคม">พฤษภาคม</option>
                        <option value="มิถุนายน">มิถุนายน</option>
                        <option value="กรกฎาคม">กรกฎาคม</option>
                        <option value="สิงหาคม">สิงหาคม</option>
                        <option value="กันยายน">กันยายน</option>
                        <option value="ตุลาคม">ตุลาคม</option>
                        <option value="พฤศจิกายน">พฤศจิกายน</option>
                        <option value="ธันวาคม">ธันวาคม</option>
                    </select>
                </div>

                <div>
                    <label for="year">ปี</label>

                    <input
                        type="number"
                        id="year"
                        placeholder="เช่น 2569"
                        required
                    >
                </div>

                <div>
                    <label for="water">ค่าน้ำ (บาท)</label>

                    <input
                        type="number"
                        id="water"
                        min="0"
                        placeholder="เช่น 1000"
                        required
                    >
                </div>

                <div>
                    <label for="electricity">ค่าไฟ (บาท)</label>

                    <input
                        type="number"
                        id="electricity"
                        min="0"
                        placeholder="เช่น 3000"
                        required
                    >
                </div>

                <div>
                    <label for="patients">จำนวนผู้ป่วย</label>

                    <input
                        type="number"
                        id="patients"
                        min="0"
                        placeholder="เช่น 20"
                        required
                    >
                </div>

            </div>

            <button
                type="submit"
                class="save-btn"
            >
                💾 บันทึกข้อมูล
            </button>

        </form>

        <div id="message"></div>

    </div>


    <!-- CHART -->
    <div class="card">

        <h2>📊 กราฟค่าน้ำค่าไฟ</h2>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

    </div>


    <!-- TABLE -->
    <div class="card">

        <h2>📋 ตารางข้อมูล</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>เดือน</th>
                        <th>ปี</th>
                        <th>ค่าน้ำ</th>
                        <th>ค่าไฟ</th>
                        <th>ผู้ป่วย</th>
                        <th>วันที่บันทึก</th>
                    </tr>
                </thead>

                <tbody id="dataTable">
                    <tr>
                        <td colspan="6">
                            กำลังโหลดข้อมูล...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div class="pagination">

            <button
                id="prevBtn"
                onclick="previousPage()"
            >
                ◀ ก่อนหน้า
            </button>

            <span id="pageInfo">
                หน้า 1
            </span>

            <button
                id="nextBtn"
                onclick="nextPage()"
            >
                ถัดไป ▶
            </button>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // URL GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
        "https://script.google.com/macros/s/AKfycbyIS-MaYfKEO5OoSFhxqVDaPkmthAiwt0j4WsFajpzd80tKsKLMHiD26pyZmfQcE7F-wQ/exec";


    // ==========================================
    // ตัวแปร
    // ==========================================

    let allData = [];

    let currentPage = 1;

    const rowsPerPage = 5;

    let myChart = null;


    // ==========================================
    // โหลดข้อมูล
    // ==========================================

    function loadData() {

        fetch(API_URL)

            .then(response => response.text())

            .then(text => {

                try {

                    const data = JSON.parse(text);

                    if (Array.isArray(data)) {

                        allData = data.slice(1);

                        displayTable();

                        createChart();

                    } else {

                        showEmptyTable();

                    }

                } catch (error) {

                    console.log("ข้อมูลจาก API:", text);

                    showEmptyTable();

                }

            })

            .catch(error => {

                console.error(error);

                showEmptyTable();

            });

    }


    // ==========================================
    // แสดงตาราง
    // ==========================================

    function displayTable() {

        const table =
            document.getElementById("dataTable");

        table.innerHTML = "";

        if (allData.length === 0) {

            showEmptyTable();

            return;
        }


        const start =
            (currentPage - 1) * rowsPerPage;

        const end =
            start + rowsPerPage;

        const pageData =
            allData.slice(start, end);


        pageData.forEach(row => {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

                <td>${row[1] || ""}</td>

                <td>${row[2] || ""}</td>

                <td>${formatNumber(row[3])}</td>

                <td>${formatNumber(row[4])}</td>

                <td>${row[5] || ""}</td>

                <td>${formatDate(row[6])}</td>

            `;

            table.appendChild(tr);

        });


        updatePagination();

    }


    // ==========================================
    // ตารางว่าง
    // ==========================================

    function showEmptyTable() {

        const table =
            document.getElementById("dataTable");

        table.innerHTML = `

            <tr>
                <td colspan="6">
                    ยังไม่มีข้อมูล
                </td>
            </tr>

        `;

        updatePagination();

    }


    // ==========================================
    // Pagination
    // ==========================================

    function updatePagination() {

        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    allData.length / rowsPerPage
                )
            );


        document.getElementById("pageInfo")
            .textContent =
            "หน้า " +
            currentPage +
            " / " +
            totalPages;


        document.getElementById("prevBtn")
            .disabled =
            currentPage <= 1;


        document.getElementById("nextBtn")
            .disabled =
            currentPage >= totalPages;

    }


    function previousPage() {

        if (currentPage > 1) {

            currentPage--;

            displayTable();

        }

    }


    function nextPage() {

        const totalPages =
            Math.ceil(
                allData.length / rowsPerPage
            );


        if (currentPage < totalPages) {

            currentPage++;

            displayTable();

        }

    }


    // ==========================================
    // สร้างกราฟ
    // ==========================================

    function createChart() {

        const labels = [];

        const waterData = [];

        const electricityData = [];


        allData.forEach(row => {

            labels.push(
                (row[1] || "") +
                " " +
                (row[2] || "")
            );

            waterData.push(
                Number(row[3]) || 0
            );

            electricityData.push(
                Number(row[4]) || 0
            );

        });


        const ctx =
            document
                .getElementById("myChart")
                .getContext("2d");


        if (myChart) {

            myChart.destroy();

        }


        myChart =
            new Chart(ctx, {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [

                        {
                            label: "ค่าน้ำ",

                            data: waterData,

                            borderWidth: 2,

                            tension: 0.3
                        },

                        {
                            label: "ค่าไฟ",

                            data: electricityData,

                            borderWidth: 2,

                            tension: 0.3
                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {

                        y: {

                            beginAtZero: true

                        }

                    }

                }

            });

    }


    // ==========================================
    // บันทึกข้อมูล
    // ==========================================

    document
        .getElementById("dataForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const month =
                document.getElementById("month").value;

            const year =
                document.getElementById("year").value;

            const water =
                document.getElementById("water").value;

            const electricity =
                document.getElementById("electricity").value;

            const patients =
                document.getElementById("patients").value;


            const message =
                document.getElementById("message");


            message.style.color = "#2563eb";

            message.textContent =
                "กำลังบันทึกข้อมูล...";


            fetch(API_URL, {

                method: "POST",

                mode: "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    month: month,

                    year: year,

                    water: water,

                    electricity: electricity,

                    patients: patients

                })

            })

            .then(() => {

                message.style.color = "green";

                message.textContent =
                    "✅ บันทึกข้อมูลสำเร็จ";


                document
                    .getElementById("dataForm")
                    .reset();


                setTimeout(function() {

                    loadData();

                }, 1000);

            })

            .catch(error => {

                console.error(error);

                message.style.color = "red";

                message.textContent =
                    "❌ ไม่สามารถบันทึกข้อมูลได้";

            });

        });


    // ==========================================
    // จัดรูปแบบตัวเลข
    // ==========================================

    function formatNumber(value) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {

            return "0";

        }

        return Number(value)
            .toLocaleString("th-TH");

    }


    // ==========================================
    // จัดรูปแบบวันที่
    // ==========================================

    function formatDate(value) {

        if (!value) {

            return "";

        }

        const date =
            new Date(value);

        if (isNaN(date.getTime())) {

            return value;

        }

        return date.toLocaleDateString("th-TH");

    }


    // ==========================================
    // Logout
    // ==========================================

    function logout() {

        window.location.href =
            "index.html";

    }


    // ==========================================
    // เริ่มต้นระบบ
    // ==========================================

    loadData();

</script>

</body>
</html>
```
