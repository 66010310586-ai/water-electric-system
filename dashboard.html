<title>Dashboard ค่าน้ำค่าไฟ</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f2f5f9;

    label {

        font-weight: bold;

        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        border: none;
        border-radius: 8px;

        cursor: pointer;

    }

        margin-top: 20px;
        background: #2563eb;
        color: white;
    }

        background: #1d4ed8;
    }

    .logout-btn {
        background: #dc2626;

        float: right;
    }

    #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

        position: relative;
        height: 400px;
    }

    .table-container {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th,
    td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
    }

    th {
        background: #2563eb;
        color: white;
    }

    tr:nth-child(even) {
        background: #f8fafc;

    .pagination {
        display: flex;
        justify-content: center;

        gap: 10px;

    #pageInfo {

    /* ซ่อน Honeypot */

    }

    .patient-normal {

    }

    @media (max-width: 700px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .chart-container {
            height: 300px;
        }
    }
</style>

</div>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbyIS-MaYfKEO5OoSFhxqVDaPkmthAiwt0j4WsFajpzd80tKsKLMHiD26pyZmfQcE7F-wQ/exec";

/* ค่าผู้ป่วยสูงสุด */
const MAX_PATIENTS = 30;

let allData = [];
let currentPage = 1;
const rowsPerPage = 5;
let myChart = null;


/* โหลดข้อมูล */

function loadData() {

    fetch(API_URL)

        .then(response => response.text())

        .then(text => {

            const data = JSON.parse(text);

            if (Array.isArray(data)) {

                allData = data.slice(1);

                displayTable();

                createChart();

            }

        })

        .catch(error => {

            console.error(error);

        });

}


/* ตาราง */

function displayTable() {

    const table =
        document.getElementById("dataTable");

    table.innerHTML = "";

    if (allData.length === 0) {

        table.innerHTML =
            "<tr><td colspan='6'>ยังไม่มีข้อมูล</td></tr>";

        updatePagination();

        return;

    }

    const start =
        (currentPage - 1) * rowsPerPage;

    const pageData =
        allData.slice(
            start,
            start + rowsPerPage
        );

    pageData.forEach(row => {

        const tr =
            document.createElement("tr");

        const patientClass =
            Number(row[5]) > MAX_PATIENTS
                ? "patient-high"
                : "patient-normal";

        tr.innerHTML = `
            <td>${row[1] || ""}</td>
            <td>${row[2] || ""}</td>
            <td>${formatNumber(row[3])}</td>
            <td>${formatNumber(row[4])}</td>

            <td class="${patientClass}">
                ${row[5] || ""}
            </td>

            <td>${formatDate(row[6])}</td>
        `;

        table.appendChild(tr);

    });

    updatePagination();

}


/* Pagination */

function updatePagination() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(allData.length / rowsPerPage)
        );

    document.getElementById("pageInfo").textContent =
        "หน้า " +
        currentPage +
        " / " +
        totalPages;

    document.getElementById("prevBtn").disabled =
        currentPage <= 1;

    document.getElementById("nextBtn").disabled =
        currentPage >= totalPages;

}


function previousPage() {

    if (currentPage > 1) {

        currentPage--;

        displayTable();

    }

}


function nextPage() {

    const totalPages =
        Math.ceil(allData.length / rowsPerPage);

    if (currentPage < totalPages) {

        currentPage++;

        displayTable();

    }

}


/* กราฟ */

function createChart() {

    const labels = [];
    const waterData = [];
    const electricityData = [];

    allData.forEach(row => {

        labels.push(
            (row[1] || "") +
            " " +
            (row[2] || "")
        );

        waterData.push(Number(row[3]) || 0);

        electricityData.push(Number(row[4]) || 0);

    });

    const ctx =
        document
            .getElementById("myChart")
            .getContext("2d");

    if (myChart) {

        myChart.destroy();

    }

    myChart =
        new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [

                    {
                        label: "ค่าน้ำ",
                        data: waterData,
                        borderWidth: 2,
                        tension: 0.3
                    },

                    {
                        label: "ค่าไฟ",
                        data: electricityData,
                        borderWidth: 2,
                        tension: 0.3
                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {
                        beginAtZero: true
                    }

                }

            }

        });

}


/* ส่งข้อมูล + Honeypot */

document
    .getElementById("dataForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");


        /* ตรวจสอบ Honeypot */

        const honeypot =
            document.getElementById("website").value;

        if (honeypot !== "") {

            message.style.color = "red";

            message.textContent =
                "❌ ตรวจพบการส่งข้อมูลที่ไม่ถูกต้อง";

            return;

        }


        const data = {

            month:
                document.getElementById("month").value,

            year:
                document.getElementById("year").value,

            water:
                document.getElementById("water").value,

            electricity:
                document.getElementById("electricity").value,

            patients:
                document.getElementById("patients").value

        };


        message.style.color = "#2563eb";

        message.textContent =
            "กำลังบันทึกข้อมูล...";


        fetch(API_URL, {

            method: "POST",

            mode: "no-cors",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(data)

        })

        .then(() => {

            message.style.color =
                "green";

            message.textContent =
                "✅ บันทึกข้อมูลสำเร็จ";

            document
                .getElementById("dataForm")
                .reset();

            setTimeout(
                loadData,
                1000
            );

        })

        .catch(error => {

            console.error(error);

            message.style.color =
                "red";

            message.textContent =
                "❌ ไม่สามารถบันทึกข้อมูลได้";

        });

    });


/* จัดรูปแบบตัวเลข */

function formatNumber(value) {

    return Number(value || 0)
        .toLocaleString("th-TH");

}


/* จัดรูปแบบวันที่ */

function formatDate(value) {

    if (!value) return "";

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString("th-TH");

}


/* Logout */

function logout() {

    window.location.href =
        "index.html";

}


/* เริ่มต้น */

loadData();

</script>

</body>
</html>
