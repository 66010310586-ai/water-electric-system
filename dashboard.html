<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard ค่าน้ำค่าไฟ</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        canvas {
            max-height: 450px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Dashboard ค่าน้ำและค่าไฟ</h1>

    <div class="card">
        <h2>📈 เปรียบเทียบค่าน้ำและค่าไฟแต่ละเดือน</h2>

        <canvas id="utilityChart"></canvas>
    </div>

</div>

<script>

const months = [
    "พ.ค. 2568",
    "มิ.ย. 2568",
    "ก.ค. 2568",
    "ส.ค. 2568",
    "ก.ย. 2568"
];

const water = [
    100,
    120,
    110,
    130,
    125
];

const electricity = [
    356,
    380,
    410,
    395,
    430
];

const ctx = document.getElementById("utilityChart");

new Chart(ctx, {
    type: "line",

    data: {
        labels: months,

        datasets: [
            {
                label: "ค่าน้ำ (หน่วย)",
                data: water,
                tension: 0.3
            },

            {
                label: "ค่าไฟฟ้า (หน่วย)",
                data: electricity,
                tension: 0.3
            }
        ]
    },

    options: {
        responsive: true,

        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

</script>

</body>
</html>
