
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard ค่าน้ำค่าไฟ</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .save-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .save-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #formMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        canvas {
            max-height: 450px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>📊 Dashboard ค่าน้ำและค่าไฟ</h1>


    <!-- แบบฟอร์มบันทึกข้อมูล -->

    <div class="card">

        <h2>📝 บันทึกข้อมูล</h2>

        <form id="dataForm">

            <div class="form-grid">


                <div class="form-group">

                    <label for="month">
                        เดือน
                    </label>

                    <select id="month" required>

                        <option value="">
                            -- เลือกเดือน --
                        </option>

                        <option value="มกราคม">มกราคม</option>
                        <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                        <option value="มีนาคม">มีนาคม</option>
                        <option value="เมษายน">เมษายน</option>
                        <option value="พฤษภาคม">พฤษภาคม</option>
                        <option value="มิถุนายน">มิถุนายน</option>
                        <option value="กรกฎาคม">กรกฎาคม</option>
                        <option value="สิงหาคม">สิงหาคม</option>
                        <option value="กันยายน">กันยายน</option>
                        <option value="ตุลาคม">ตุลาคม</option>
                        <option value="พฤศจิกายน">พฤศจิกายน</option>
                        <option value="ธันวาคม">ธันวาคม</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        ปี
                    </label>

                    <input
                        type="number"
                        id="year"
                        placeholder="เช่น 2569"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="water">
                        💧 ค่าน้ำ
                    </label>

                    <input
                        type="number"
                        id="water"
                        placeholder="กรอกค่าน้ำ"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="electricity">
                        ⚡ ค่าไฟ
                    </label>

                    <input
                        type="number"
                        id="electricity"
                        placeholder="กรอกค่าไฟ"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label for="patients">
                        🏥 จำนวนผู้ป่วย
                    </label>

                    <input
                        type="number"
                        id="patients"
                        placeholder="กรอกจำนวนผู้ป่วย"
                        min="0"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                💾 บันทึกข้อมูล
            </button>


            <div id="formMessage"></div>

        </form>

    </div>


    <!-- กราฟ -->

    <div class="card">

        <h2>
            📈 เปรียบเทียบค่าน้ำและค่าไฟแต่ละเดือน
        </h2>

        <canvas id="utilityChart"></canvas>

    </div>

</div>



<script>


// =====================================================
// Google Apps Script Web App URL
// =====================================================

const API_URL = "https://script.google.com/macros/s/AKfycbyIS-MaYfKEO5OoSFhxqVDaPkmthAiwt0j4WsFajpzd80tKsKLMHiD26pyZmfQcE7F-wQ/exec";



// =====================================================
// ตัวแปรกราฟ
// =====================================================

let utilityChart;



// =====================================================
// โหลดข้อมูลจาก Google Sheets
// =====================================================

async function loadData() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();


        console.log("ข้อมูลจาก Google Sheets:", data);


        // ถ้ายังไม่มีข้อมูล

        if (!data || data.length <= 1) {

            createChart([], [], []);

            return;
        }


        // ตัดหัวตารางออก

        const rows =
            data.slice(1);


        const months = [];

        const water = [];

        const electricity = [];


        rows.forEach(function(row) {

            if (row.length >= 6) {

                months.push(
                    row[1] + " " + row[2]
                );

                water.push(
                    Number(row[3]) || 0
                );

                electricity.push(
                    Number(row[4]) || 0
                );

            }

        });


        createChart(
            months,
            water,
            electricity
        );


    } catch (error) {

        console.error(
            "ไม่สามารถโหลดข้อมูล:",
            error
        );

        createChart([], [], []);

    }

}



// =====================================================
// สร้างกราฟ
// =====================================================

function createChart(
    months,
    water,
    electricity
) {


    const ctx =
        document.getElementById(
            "utilityChart"
        );


    if (utilityChart) {

        utilityChart.destroy();

    }


    utilityChart =
        new Chart(ctx, {

            type: "line",

            data: {

                labels: months,

                datasets: [

                    {

                        label: "ค่าน้ำ",

                        data: water,

                        tension: 0.3

                    },

                    {

                        label: "ค่าไฟ",

                        data: electricity,

                        tension: 0.3

                    }

                ]

            },


            options: {

                responsive: true,

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        });

}



// =====================================================
// บันทึกข้อมูลลง Google Sheets
// =====================================================

document
    .getElementById("dataForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const month =
                document.getElementById(
                    "month"
                ).value;


            const year =
                document.getElementById(
                    "year"
                ).value;


            const water =
                document.getElementById(
                    "water"
                ).value;


            const electricity =
                document.getElementById(
                    "electricity"
                ).value;


            const patients =
                document.getElementById(
                    "patients"
                ).value;


            const message =
                document.getElementById(
                    "formMessage"
                );


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            // แสดงสถานะกำลังบันทึก

            saveButton.disabled = true;

            saveButton.textContent =
                "⏳ กำลังบันทึก...";


            message.style.color =
                "#2563eb";

            message.textContent =
                "กำลังบันทึกข้อมูล...";


            try {


                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        mode: "no-cors",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body: JSON.stringify({

                            month: month,

                            year: year,

                            water: water,

                            electricity:
                                electricity,

                            patients: patients

                        })

                    }
                );


                // แสดงผลสำเร็จ

                message.style.color =
                    "green";

                message.textContent =
                    "✅ บันทึกข้อมูลลง Google Sheets แล้ว";


                // ล้างฟอร์ม

                document
                    .getElementById("dataForm")
                    .reset();


                // โหลดข้อมูลใหม่

                setTimeout(
                    loadData,
                    1000
                );


            } catch (error) {


                console.error(error);


                message.style.color =
                    "red";

                message.textContent =
                    "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";


            }


            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 บันทึกข้อมูล";

        }
    );



// =====================================================
// เริ่มต้นระบบ
// =====================================================

loadData();


</script>

</body>

</html>
```
